<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Nunito, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#003057"/></marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Oswald, Arial Narrow, sans-serif" font-size="24" fill="#003057" letter-spacing="2">HOW A KEY PRESS BECOMES A SHORTCUT</text>
  <g font-size="16" text-anchor="middle">
    <rect x="30" y="110" width="170" height="130" rx="12" fill="#fdf3d4" stroke="#b3a369" stroke-width="2"/>
    <text x="115" y="160" font-weight="700" fill="#003057">16 Key Switches</text>
    <text x="115" y="186" fill="#5b6270" font-size="14">Cherry MX Black</text>
    <text x="115" y="206" fill="#5b6270" font-size="14">close a circuit</text>

    <rect x="255" y="110" width="170" height="130" rx="12" fill="#fdf3d4" stroke="#b3a369" stroke-width="2"/>
    <text x="340" y="160" font-weight="700" fill="#003057">GPIO Pins</text>
    <text x="340" y="186" fill="#5b6270" font-size="14">input with pull-up</text>
    <text x="340" y="206" fill="#5b6270" font-size="14">reads 1 or 0</text>

    <rect x="480" y="110" width="170" height="130" rx="12" fill="#f6c945" stroke="#b3a369" stroke-width="2"/>
    <text x="565" y="160" font-weight="700" fill="#1d2430">Raspberry Pi Pico</text>
    <text x="565" y="186" fill="#1d2430" font-size="14">scans keys, debounces</text>
    <text x="565" y="206" fill="#1d2430" font-size="14">looks up the macro</text>

    <rect x="705" y="110" width="170" height="130" rx="12" fill="#003057"/>
    <text x="790" y="160" font-weight="700" fill="#ffffff">Computer</text>
    <text x="790" y="186" fill="#dfe6ee" font-size="14">sees a USB keyboard</text>
    <text x="790" y="206" fill="#dfe6ee" font-size="14">runs the shortcut</text>
  </g>
  <g stroke="#003057" stroke-width="3" marker-end="url(#a)">
    <line x1="200" y1="175" x2="250" y2="175"/><line x1="425" y1="175" x2="475" y2="175"/><line x1="650" y1="175" x2="700" y2="175"/>
  </g>
  <text x="677" y="275" text-anchor="middle" font-size="14" fill="#5b6270">USB HID</text>
  <text x="450" y="320" text-anchor="middle" font-size="14" fill="#5b6270">Input → digital logic → processing → output. The same flow we study in ECE 2020.</text>
</svg>
